    spring.application.name=employee-management

    server.port=8089

    spring.datasource.url=jdbc:mysql://mysql:3306/employeedb
    spring.datasource.username=root
    spring.datasource.password=root
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

    logging.level.root=INFO
    logging.level.com.example.employeemanagement=DEBUG

    logging.file.name=logs/employee-management.log


    # Redis (use host "redis" in Docker; "localhost" when running app on your PC)
    spring.data.redis.host=redis
    spring.data.redis.port=6379
    spring.cache.type=redis


    # Actuator + Prometheus
    management.endpoints.web.exposure.include=health,info,prometheus,metrics
    management.endpoint.health.show-details=always
    management.endpoint.prometheus.enabled=true
    management.metrics.export.prometheus.enabled=true
    management.metrics.tags.application=employee-management
    management.metrics.enable.jvm=true
    management.metrics.enable.http=true

    # Zipkin (use host "zipkin" in Docker; "localhost" when running app on your PC)
    management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
    management.tracing.sampling.probability=1.0
